<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="pv-cover-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pv-gold-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Book background -->
  <rect width="300" height="450" rx="8" fill="url(#pv-cover-grad)"/>
  <!-- Decorative border -->
  <rect x="14" y="14" width="272" height="422" rx="6" fill="none" stroke="url(#pv-gold-grad)" stroke-width="1.8" opacity="0.6"/>
  <rect x="20" y="20" width="260" height="410" rx="4" fill="none" stroke="url(#pv-gold-grad)" stroke-width="0.8" opacity="0.35"/>
  <!-- Spine groove -->
  <line x1="32" y1="14" x2="32" y2="436" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <line x1="35" y1="14" x2="35" y2="436" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
  <!-- Book emblem -->
  <g transform="translate(150,175)">
    <circle cx="0" cy="0" r="32" fill="rgba(245,158,11,0.12)" stroke="url(#pv-gold-grad)" stroke-width="1.5"/>
    <path d="M-16,-10 C-16,-10 -3,-16 0,-16 C3,-16 16,-10 16,-10 L16,14 C16,14 3,8 0,8 C-3,8 -16,14 -16,14 Z" stroke="#F59E0B" stroke-width="1.8" fill="none"/>
    <line x1="0" y1="-16" x2="0" y2="8" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
  <!-- Typography -->
  <text x="150" y="240" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="0.1em">PAGEVAULT</text>
  <text x="150" y="260" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="0.18em">SPECIAL EDITION</text>
  <line x1="100" y1="280" x2="200" y2="280" stroke="url(#pv-gold-grad)" stroke-width="1" opacity="0.5"/>
  <text x="150" y="400" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.1em">CURATED COLLECTION</text>
</svg>