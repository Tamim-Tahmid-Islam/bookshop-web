<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <rect width="300" height="450" rx="6" fill="#EAE3D4"/>
  <rect x="20" y="20" width="260" height="410" rx="4" fill="#F3EEE3" stroke="#E2DAD0" stroke-width="1"/>
  <!-- Book spine lines -->
  <line x1="40" y1="20" x2="40" y2="430" stroke="#E2DAD0" stroke-width="1.5"/>
  <!-- Book icon -->
  <g transform="translate(150,180)" opacity="0.35">
    <path d="M-30,-25 C-30,-25 -5,-35 0,-35 C5,-35 30,-25 30,-25 L30,25 C30,25 5,15 0,15 C-5,15 -30,25 -30,25 Z" stroke="#736C62" stroke-width="2" fill="none"/>
    <line x1="0" y1="-35" x2="0" y2="15" stroke="#736C62" stroke-width="1.5"/>
  </g>
  <!-- "No Cover" text -->
  <text x="150" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#9E9689" letter-spacing="0.08em">NO COVER</text>
  <text x="150" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#9E9689">AVAILABLE</text>
</svg>
