<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9541E" />
      <stop offset="100%" stop-color="#BF4413" />
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#24201C" />
    </linearGradient>
  </defs>

  <!-- Logo Icon: Vault Shield + Open Book -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal Vault Shield Base -->
    <polygon points="40,4 74,22 74,62 40,80 6,62 6,22" fill="#111111" stroke="#D9541E" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Outer Vault Notches -->
    <circle cx="40" cy="10" r="2.5" fill="#D9541E" />
    <circle cx="68" cy="26" r="2.5" fill="#D9541E" />
    <circle cx="68" cy="58" r="2.5" fill="#D9541E" />
    <circle cx="40" cy="74" r="2.5" fill="#D9541E" />
    <circle cx="12" cy="58" r="2.5" fill="#D9541E" />
    <circle cx="12" cy="26" r="2.5" fill="#D9541E" />

    <!-- Open Book Pages inside Vault -->
    <!-- Left Page -->
    <path d="M 40,32 C 32,30 24,33 18,37 L 18,59 C 24,55 32,53 40,55 Z" fill="#24201C" stroke="#F3EEE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Page -->
    <path d="M 40,32 C 48,30 56,33 62,37 L 62,59 C 56,55 48,53 40,55 Z" fill="#24201C" stroke="#F3EEE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Book Spine -->
    <line x1="40" y1="31" x2="40" y2="56" stroke="#D9541E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Keyhole / Vault Core -->
    <circle cx="40" cy="42" r="3" fill="#D9541E" />
    <polygon points="38.5,43 41.5,43 42,49 38,49" fill="#D9541E" />
  </g>

  <!-- Wordmark -->
  <text x="108" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#111111">
    Page<tspan fill="#D9541E">Vault</tspan>
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="110" y="73" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2" fill="#736C62">
    CURATED ONLINE BOOKSHOP
  </text>
</svg>
